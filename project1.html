<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پروژه اول من</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Tahoma, sans-serif;
            background-color: #f0f4ff;
            color: #333;
            text-align: center;
        }

        .project-card {
            max-width: 650px;
            margin: 40px auto;
            padding: 35px 25px;
            background-color: white;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #6c4cf1;
            font-size: 30px;
        }

        p {
            font-size: 17px;
            line-height: 2;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 24px;
            background-color: #6c4cf1;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
        }

        .back-link:hover {
            background-color: #4c30c9;
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }

            p {
                font-size: 15px;
            }

            .project-card {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="project-card">
        <h1>🌷 پروژه اول من</h1>

        <p>
            این اولین صفحه پروژه مستقل من است.
            من در حال یادگیری طراحی سایت با HTML،
            CSS و JavaScript هستم.
        </p>

        <a class="back-link" href="index.html">
            برگشت به سایت اصلی 💜
        </a>
    </div>

</body>
</html>
