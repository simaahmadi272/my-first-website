<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پروژه دوم | فرم تماس</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f0f4ff;
            font-family: Tahoma, sans-serif;
            color: #333;
        }

        .contact-card {
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #6c4cf1;
            text-align: center;
            font-size: 28px;
        }

        .description {
            text-align: center;
            line-height: 2;
            color: #666;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #d8d4eb;
            border-radius: 10px;
            font-family: Tahoma, sans-serif;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #6c4cf1;
            box-shadow: 0 0 0 3px rgba(108, 76, 241, 0.15);
        }

        button,
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 22px;
            border: none;
            border-radius: 10px;
            background-color: #6c4cf1;
            color: white;
            font-family: Tahoma, sans-serif;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover,
        .back-link:hover {
            background-color: #4c30c9;
            transform: translateY(-2px);
        }

        #form-status {
            line-height: 1.9;
            font-weight: bold;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .contact-card {
                padding: 22px 18px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="contact-card">
        <h1>💌 فرم تماس با من</h1>

        <p class="description">
            خوشحال می‌شم پیامت رو بخونم!
        </p>

        <form id="contact-form">
            <label for="name">نام شما:</label>
            <input
                type="text"
                id="name"
                placeholder="نامت رو بنویس"
                required
            >

            <label for="email">ایمیل شما:</label>
            <input
                type="email"
                id="email"
                placeholder="example@mail.com"
                required
            >

            <label for="message">پیام شما:</label>
            <textarea
                id="message"
                rows="5"
                placeholder="پیامت رو اینجا بنویس"
                required
            ></textarea>

            <button type="submit">بررسی و ثبت پیام 💜</button>
        </form>

        <p id="form-status" aria-live="polite"></p>

        <div style="text-align: center;">
            <a class="back-link" href="index.html">
                برگشت به سایت اصلی
            </a>
        </div>
    </main>

   <script>
const contactForm = document.getElementById("contact-form");
const formStatus = document.getElementById("form-status");

contactForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!name || !email || !message) {
        formStatus.textContent = "لطفاً همه کادرها رو پر کن 💜";
        formStatus.style.color = "#c0392b";
        formStatus.style.backgroundColor = "#fee2e2";
        formStatus.style.padding = "12px";
        return;
    }

    formStatus.textContent = "در حال ارسال پیام...";
    formStatus.style.color = "#6c4cf1";
    formStatus.style.backgroundColor = "#eee9ff";
    formStatus.style.padding = "12px";

    try {
        const response = await fetch(
            "https://api.web3forms.com/submit",
            {
                method: "POST",
                headers: {
                    "Accept": "application/json"
                },
                body: new FormData(contactForm)
            }
        );

        const result = await response.json();

        if (response.ok && result.success === true) {
            formStatus.textContent =
                "پیامت با موفقیت ارسال شد! ممنون از اعتمادت 💚";
            formStatus.style.color = "#166534";
            formStatus.style.backgroundColor = "#dcfce7";
            contactForm.reset();
        } else {
            formStatus.textContent =
                result.message ||
                result.body?.message ||
                "ارسال انجام نشد. لطفاً تنظیمات فرم رو بررسی کن.";
            formStatus.style.color = "#c0392b";
            formStatus.style.backgroundColor = "#fee2e2";
        }
    } catch (error) {
        formStatus.textContent =
            "ارتباط برقرار نشد. اینترنت رو بررسی کن و دوباره امتحان کن.";
        formStatus.style.color = "#c0392b";
        formStatus.style.backgroundColor = "#fee2e2";
    }
});
</script>

</body>
</html>
